<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dawn Sogni</title>
  <meta name="description" content="Music and lyrics." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" href="assets/ds-logo-sm.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <a href="#/" class="logo" aria-label="Home"><img src="assets/ds-logo-dark.png" alt="Dawn Sogni" /></a>
    <a class="shop" id="shop" href="#" target="_blank" rel="noopener" hidden>Shop ↗</a>
  </header>

  <main id="view"></main>

  <footer class="player" id="player" hidden>
    <div class="bar" id="seek"><div class="fill" id="fill"></div></div>
    <img class="p-cover" id="p-cover" alt="" />
    <div class="p-meta" id="p-meta"><div class="p-title" id="p-title"></div><div class="p-time" id="p-time">0:00 / 0:00</div></div>
    <div class="p-ctrl">
      <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
      <button id="play" class="p-play" aria-label="Play"><svg viewBox="0 0 24 24"><path id="play-ico" d="M8 5v14l11-7z"/></svg></button>
      <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
