<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dawn Sogni</title>
  <meta name="description" content="Music and lyrics." />
  <meta name="theme-color" content="#3a0710" />
  <link rel="icon" type="image/png" href="assets/ds-logo-sm.png" />
  <link rel="stylesheet" href="styles.css?v=1795633020" />
</head>
<body>
  <!-- ambient red light -->
  <div class="bg" aria-hidden="true">
    <div class="bg-cover" id="bg-cover"></div>
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>

  <div class="app">
    <main id="view"></main>
  </div>

  <!-- mini player -->
  <div class="mini glass" id="mini" hidden>
    <div class="mini-fill" id="mini-fill"></div>
    <img class="mini-cover" id="mini-cover" alt="" />
    <div class="mini-meta" id="mini-meta"><div class="mini-title" id="mini-title"></div><div class="mini-sub" id="mini-sub">Now playing</div></div>
    <button class="circle-btn" id="mini-play" aria-label="Play"><svg viewBox="0 0 24 24"><path class="ico-pp" d="M8 5v14l11-7z"/></svg></button>
  </div>

  <script src="app.js?v=1795633020"></script>
</body>
</html>
