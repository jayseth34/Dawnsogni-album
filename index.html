<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dawn Sogni</title>
  <meta name="description" content="Music, videos and releases." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" href="assets/ds-logo-sm.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="tint" aria-hidden="true"></div>

  <header class="hdr" id="hdr">
    <nav class="hdr-nav">
      <a href="#music">Music</a>
      <a href="#videos" data-sec="videos" hidden>Videos</a>
      <a href="#events" data-sec="events" hidden>Events</a>
    </nav>
    <a href="#top" class="hdr-logo" aria-label="Home"><img src="assets/ds-logo-dark.png" alt="Dawn Sogni" /></a>
    <a class="hdr-shop" id="shop-link" href="https://jayseth34.github.io/DawnSogniWeb/" target="_blank" rel="noopener">Shop <span aria-hidden="true">↗</span></a>
  </header>

  <main id="top">
    <section class="hero" id="hero"></section>

    <section class="sec" id="music">
      <div class="sec-head">
        <h2>Music</h2>
        <div class="chips" id="chips"></div>
      </div>
      <div class="grid" id="releases"></div>
    </section>

    <section class="sec" id="videos" hidden>
      <div class="sec-head"><h2>Videos</h2></div>
      <div class="vgrid" id="video-grid"></div>
    </section>

    <section class="sec" id="events" hidden>
      <div class="sec-head"><h2>Events</h2></div>
      <ul class="events" id="event-list"></ul>
    </section>

    <footer class="foot" id="foot"></footer>
  </main>

  <!-- Release sheet -->
  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-bg" id="sheet-bg"></div>
    <button class="x-btn" id="sheet-close" aria-label="Close">✕</button>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <!-- Video modal -->
  <div class="modal" id="modal" aria-hidden="true">
    <button class="x-btn" id="modal-close" aria-label="Close">✕</button>
    <div class="modal-frame" id="modal-frame"></div>
  </div>

  <!-- Player bar -->
  <div class="player" id="player" hidden>
    <div class="pl-progress" id="pl-progress"><div id="pl-fill"></div></div>
    <img class="pl-cover" id="pl-cover" alt="" />
    <div class="pl-meta"><div class="pl-title" id="pl-title"></div><div class="pl-sub" id="pl-sub"></div></div>
    <div class="pl-ctrl">
      <button id="pl-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
      <button id="pl-play" class="pl-play" aria-label="Play"><svg viewBox="0 0 24 24"><path id="pl-icon" d="M8 5v14l11-7z"/></svg></button>
      <button id="pl-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <div class="pl-time" id="pl-time">0:00 / 0:00</div>
    <div class="pl-extra">
      <button id="pl-lyrics" class="txt-btn" hidden>Lyrics</button>
      <button id="pl-video" class="txt-btn" hidden>Video</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
