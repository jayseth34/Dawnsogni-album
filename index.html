<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DAWN SOGNI — EXPLORE</title>
  <meta name="description" content="Explore the Dawn Sogni world — music, visuals, drops, shop." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" href="assets/ds-logo-sm.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500&family=Cinzel:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Blurred background of the active card -->
  <div class="bg" aria-hidden="true">
    <canvas id="bg-canvas"></canvas>
    <video id="bg-video" muted loop playsinline></video>
    <img id="bg-img" alt="" />
  </div>
  <div class="bg-shade" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Gate -->
  <div class="gate" id="gate">
    <video class="gate-video" id="gate-video" src="assets/ds-intro.mp4" poster="assets/ds-intro-poster.jpg" muted autoplay loop playsinline></video>
    <button class="gate-enter" id="enter">ENTER</button>
  </div>

  <!-- Top bar -->
  <header class="top">
    <button class="top-left" id="back"><span id="back-label"></span></button>
    <button class="top-logo" id="home" aria-label="Dawn Sogni home"><img src="assets/ds-logo-dark.png" alt="Dawn Sogni" /></button>
    <button class="pill" id="shop-pill">SHOP<span id="bag-count"></span></button>
  </header>

  <!-- World / carousel -->
  <main class="world" id="world">
    <div class="heading">
      <p class="eyebrow">EXPLORE</p>
      <h1>DAWN SOGNI WORLD</h1>
    </div>
    <div class="track" id="track"></div>
    <p class="label" id="label">&nbsp;</p>
    <button class="emblem" id="emblem" aria-label="Open">
      <svg viewBox="0 0 200 200" class="emblem-ring" aria-hidden="true">
        <defs><path id="circ" d="M100,100 m-80,0 a80,80 0 1,1 160,0 a80,80 0 1,1 -160,0" /></defs>
        <text><textPath href="#circ" textLength="500">DAWN SOGNI · SOGNI VOL. I · DAWN SOGNI · SOGNI VOL. I ·</textPath></text>
      </svg>
      <img src="assets/ds-logo-dark.png" alt="" class="emblem-logo" />
    </button>
  </main>

  <!-- Panel (opens over the world) -->
  <section class="panel" id="panel" aria-hidden="true">
    <div class="panel-inner" id="panel-inner"></div>
  </section>

  <!-- Bag drawer -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head"><span>BAG</span><button id="drawer-close" aria-label="Close">✕</button></div>
    <ul class="cart-items" id="cart-items"></ul>
    <div class="drawer-foot">
      <div class="total"><span>TOTAL</span><span id="cart-total">₹0</span></div>
      <button class="btn" id="checkout">CHECKOUT</button>
      <p class="note" id="checkout-msg"></p>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast"></div>

  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
